<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Invoice QR">
  <title>Invoice QR Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#f5f7fa;color:#111827}
    .wrap{max-width:640px;margin:auto;padding:18px}
    .card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(16,24,40,.05)}
    h1{margin:0 0 6px;font-size:26px}
    p{color:#667085;margin:0 0 16px}
    button{width:100%;border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:700;background:#175cd3;color:#fff}
    .secondary{background:#eef2f6;color:#1d2939;margin-top:10px}
    video{width:100%;border-radius:14px;background:#000;display:none;margin-top:14px}
    canvas{display:none}
    .msg{display:none;margin-top:12px;padding:11px;border-radius:10px;font-size:14px}
    .ok{display:block;background:#ecfdf3;color:#067647}
    .warn{display:block;background:#fffaeb;color:#b54708}
    .err{display:block;background:#fef3f2;color:#b42318}
    input{width:100%;box-sizing:border-box;border:1px solid #d0d5dd;border-radius:10px;padding:12px;font-size:16px;margin-top:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Invoice QR</h1>
    <p>Σκάναρε το QR του παραστατικού.</p>
    <button onclick="startScanner()">ΣΚΑΝΑΡΕ QR</button>
    <button class="secondary" onclick="stopScanner()">Κλείσιμο κάμερας</button>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="msg" class="msg"></div>

    <input id="manual" placeholder="ή επικόλλησε εδώ το QR URL">
    <button class="secondary" onclick="goManual()">Συνέχεια με URL</button>
  </div>
</div>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbwOABBrN854JEhRJgwbOUVpdnL0WV7seVYNu3pdQYTVShbnjzHtUAi-WBr8pu5mHWm3/exec";
let stream=null, scanning=false;
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});

async function startScanner(){
  try{
    msg('Ζητείται πρόσβαση στην κάμερα...','warn');
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},
      audio:false
    });
    video.srcObject=stream;
    video.style.display='block';
    await video.play();
    scanning=true;
    msg('Στόχευσε το QR.','ok');
    requestAnimationFrame(scanFrame);
  }catch(e){
    msg('Δεν άνοιξε η κάμερα: '+e.message,'err');
  }
}

function stopScanner(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.style.display='none';
}

function scanFrame(){
  if(!scanning)return;
  if(video.readyState===video.HAVE_ENOUGH_DATA){
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const img=ctx.getImageData(0,0,canvas.width,canvas.height);
    const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
    if(code && code.data){
      const value=code.data.trim();
      stopScanner();
      msg('QR διαβάστηκε. Άνοιγμα παραστατικού...','ok');
      window.location.href=APP_URL+'?qr='+encodeURIComponent(value);
      return;
    }
  }
  requestAnimationFrame(scanFrame);
}

function goManual(){
  const value=document.getElementById('manual').value.trim();
  if(!value){msg('Βάλε πρώτα το QR URL.','warn');return;}
  window.location.href=APP_URL+'?qr='+encodeURIComponent(value);
}

function msg(t,cls){
  const e=document.getElementById('msg');
  e.className='msg '+cls;
  e.textContent=t;
}
</script>
</body>
</html>
